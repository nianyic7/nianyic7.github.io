# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------
theme: minimal-mistakes-jekyll # pinned to 4.28.1 in the Gemfile
minimal_mistakes_skin: default # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise", "catppuccin_latte", "catppuccin_mocha"

# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------
locale: en-US
title: Nianyi Chen
name: Nianyi Chen
description: Postdoc Member at the IAS, Princeton, joint with MPA, Garching
url: https://nianyic7.github.io
baseurl: ""
repository: nianyic7/nianyic7.github.io
search: false

# -----------------------------------------------------------------------------
# Author profile (sidebar)
# -----------------------------------------------------------------------------
author:
  name: Nianyi Chen
  avatar: /assets/img/headshot.png
  bio: Postdoc Member at the IAS, Princeton, joint with MPA, Garching
  location: Princeton, NJ
  email: nianyi.chen7@gmail.com
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/nianyic7
    - label: ORCID
      icon: fab fa-fw fa-orcid
      url: https://orcid.org/0000-0001-6627-2533
    # CV link hidden for now; uncomment to show it again.
    # - label: CV
    #   icon: fas fa-fw fa-file-pdf
    #   url: /assets/pdf/CV_Nianyi.pdf

footer:
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/nianyic7
    - label: ORCID
      icon: fab fa-fw fa-orcid
      url: https://orcid.org/0000-0001-6627-2533

# -----------------------------------------------------------------------------
# Content
# -----------------------------------------------------------------------------
include: [_pages]

collections:
  notes:
    output: true
    permalink: /notes/:name/
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: notes
    values:
      layout: single
      author_profile: true
      sitemap: false

# -----------------------------------------------------------------------------
# Markdown
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jemoji
