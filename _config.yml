# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------
theme: minimal-mistakes-jekyll # pinned to 4.28.1 in the Gemfile
minimal_mistakes_skin: default # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise", "catppuccin_latte", "catppuccin_mocha"

# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------
locale: en-US
title: Nianyi Chen
name: Nianyi Chen
description: PhD student in astrophysics @ Carnegie Mellon University
url: https://nianyic7.github.io
baseurl: ""
repository: nianyic7/nianyic7.github.io
search: false

# -----------------------------------------------------------------------------
# Author profile (sidebar)
# -----------------------------------------------------------------------------
author:
  name: Nianyi Chen
  avatar: /assets/img/prof_pic.png
  bio: PhD student in astrophysics @ Carnegie Mellon University
  location: McWilliams Center for Cosmology, Carnegie Mellon University, Pittsburgh, PA, USA 15213
  email: nianyic@andrew.cmu.edu
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/nianyic7
    - label: ORCID
      icon: fab fa-fw fa-orcid
      url: https://orcid.org/0000-0001-6627-2533
    - label: CV
      icon: fas fa-fw fa-file-pdf
      url: /assets/pdf/CV_Nianyi.pdf

footer:
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/nianyic7
    - label: ORCID
      icon: fab fa-fw fa-orcid
      url: https://orcid.org/0000-0001-6627-2533

# -----------------------------------------------------------------------------
# Content
# -----------------------------------------------------------------------------
include: [_pages]
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true
      share: false

# -----------------------------------------------------------------------------
# Markdown
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll/scholar
  - jemoji

# -----------------------------------------------------------------------------
# Jekyll Scholar (publications page)
# -----------------------------------------------------------------------------
scholar:
  last_name: [Chen]
  first_name: [Nianyi, N.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: year
  group_order: descending
