# Research themes shown on the Research page (_pages/projects.md).
# Papers are listed most recent first; `me: true` marks first-author papers.

- id: mbh-mergers
  title: Massive Black Hole Mergers & Gravitational Waves
  image: /assets/img/merger/background.png
  summary: >
    Modeling how massive black holes sink, pair up, and merge in cosmological
    simulations, and predicting the gravitational-wave signals they produce for
    LISA and pulsar timing arrays.
  papers:
    - title: "The Gravitational-wave Background from Massive Black Holes in the ASTRID Simulation"
      authors: Chen, N., et al.
      me: true
      venue: ApJL, 991, L19
      year: 2025
      doi: 10.3847/2041-8213/adefe2
      arxiv: 2502.01024
    - title: "MAGICS I. The First Few Orbits Encode the Fate of Seed Massive Black Hole Pairs"
      authors: Chen, N., et al.
      me: true
      venue: OJAp, 7
      year: 2024
      doi: 10.33232/001c.116179
      arxiv: 2312.09183
    - title: "Massive black hole mergers with orbital information: predictions from the ASTRID simulation"
      authors: Chen, N., et al.
      me: true
      venue: MNRAS, 514, 2220
      year: 2022
      doi: 10.1093/mnras/stac1432
      arxiv: 2112.08555
    - title: "Dynamical friction modelling of massive black holes in cosmological simulations and effects on merger rate predictions"
      authors: Chen, N., et al.
      me: true
      venue: MNRAS, 510, 531
      year: 2022
      doi: 10.1093/mnras/stab3411
      arxiv: 2104.00021

